- topic: sponsorship
  time_sensitive: true
  question: Will Vishal require visa sponsorship?
  answer: >
    Not to start. Vishal has the right to work in the UK now on his Student
    visa, and on completing his MSc in January 2027 he plans to move to the UK
    Graduate Route (Post-Study Work) visa, which grants unrestricted full-time
    work rights with no employer sponsorship and no salary threshold. That means
    an employer can hire him for a full-time role from January 2027 with no
    sponsorship cost, no Certificate of Sponsorship, and no Home Office
    paperwork. Under the current rules the Graduate Route runs for 18 months,
    taking him to approximately mid-2028. Only after that would he need an
    employer to sponsor a Skilled Worker visa, so a hiring team has around 18
    months to work with him before any sponsorship decision is needed. He is
    happy to confirm exact dates and current entitlements directly.

