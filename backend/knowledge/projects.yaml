# Projects from Vishal Khan's resume and GitHub (github.com/DataScienceVishal)

- name: AI Digital Twin - Full-Stack RAG Assistant
  slug: ai-digital-twin
  description: >
    This site. A production RAG (Retrieval-Augmented Generation) assistant that
    answers recruiter and technical-interview questions from grounded, cited
    evidence rather than free-form generation. The FastAPI backend indexes a
    curated YAML knowledge base, a resume PDF, and live GitHub repositories into
    ChromaDB using Azure OpenAI text-embedding-3-small, and generates answers
    with GPT-5 mini. Retrieval combines intent classification, over-fetching with
    source boosting, a relevance threshold, and conversation-aware query
    expansion so follow-up questions keep their subject. Answers stream over
    Server-Sent Events with tool calling and inline source citations. The
    React 19 + Vite + Tailwind frontend renders markdown, Mermaid diagrams and
    three tailored modes (General, Recruiter, Interview). Rebuilt from an
    earlier vanilla-JavaScript prototype, which is now retired.
  tech_stack: [Python, FastAPI, ChromaDB, Azure OpenAI, RAG, React 19, TypeScript, Vite, Tailwind CSS, Docker, Railway, Vercel]
  github_url: https://github.com/DataScienceVishal/ai-professional-twin
  category: Software Engineering
  highlights:
    - Full RAG pipeline - chunking, embedding, retrieval, generation, citations
    - Source boosting with a relevance threshold instead of hard metadata filtering
    - Conversation-aware retrieval so follow-up questions keep their context
    - SSE streaming with tool calling and live GitHub repository ingestion
    - Non-blocking background ingestion with a content-hash manifest, so
      unchanged documents are never re-embedded and cold starts stay fast
    - Cost and abuse controls - per-IP rate limiting and a global daily budget
    - Prompt-injection hardening on untrusted ingested content
    - 178 automated tests in CI with ruff, mypy --strict, oxlint and vitest

- name: Image Classification with CNN (CIFAR-10)
  slug: image-classification-cnn-cifar10
  description: >
    Developed a Convolutional Neural Network model for image classification on
    the CIFAR-10 dataset. Designed a CNN in TensorFlow/Keras with normalization,
    dropout, and L2 regularization to enhance accuracy and generalization.
    Achieved a training accuracy of 72.12% and a validation accuracy of 74.06%.
  tech_stack: [Python, TensorFlow, Keras]
  github_url: https://github.com/DataScienceVishal/CIFAR-10-CNN
  category: Deep Learning
  highlights:
    - CNN architecture with normalization, dropout, and L2 regularization
    - 72.12% training accuracy and 74.06% validation accuracy
    - Focus on generalization through regularization techniques

- name: Telecom Churn Prediction
  slug: telecom-churn-prediction
  description: >
    Predicted customer churn from 21 predictor variables and identified the
    strongest retention levers. Ran EDA, preprocessing, and feature engineering
    in Python/SQL, then benchmarked classification models including Logistic
    Regression. Achieved ~80% accuracy and identified tenure as the strongest
    churn predictor.
  tech_stack: [Python, Pandas, Scikit-learn, SQL]
  github_url: https://github.com/DataScienceVishal/Telecom_Churn
  category: Machine Learning
  highlights:
    - Full EDA, preprocessing, and feature engineering pipeline
    - ~80% accuracy using Logistic Regression
    - Identified customer tenure as the strongest churn predictor

- name: Reinforcement Learning for Dynamic Pricing in E-commerce
  slug: rl-dynamic-pricing
  description: >
    MSc thesis testing whether RL can outperform pricing rules in a simulated
    e-commerce environment. Built a custom Gym-style environment on real
    e-commerce data, then trained DQN, A2C, and PPO agents over multi-episode
    simulations. DQN produced the most stable profit curve. Wrote up the
    comparative analysis as part of the dissertation at LJMU, 2024.
  tech_stack: [Python, Reinforcement Learning, OpenAI Gym, DQN, A2C, PPO]
  github_url: ""
  category: Research
  highlights:
    - Custom Gym-style environment on real e-commerce data
    - Compared DQN, A2C, and PPO agents for dynamic pricing
    - DQN produced the most stable profit curve
    - MSc dissertation at LJMU (2024)
