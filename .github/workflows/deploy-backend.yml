# Builds the backend image and publishes it to GHCR.
#
# Azure's own build service (ACR Tasks) is not permitted on the student
# subscription this project runs on, so the image has to be built outside
# Azure. GitHub's runners are x64, which is what Container Apps needs - a local
# build on an Apple Silicon machine would have to cross-compile under QEMU.
#
# This workflow only publishes the image. Rolling it out is a separate
# `az containerapp update --image ...`, which keeps Azure credentials out of
# GitHub entirely.
name: Backend image

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name
        id: image
        # GHCR rejects uppercase path segments and the owner here is
        # "DataScienceVishal", so it has to be lowercased.
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${owner}/ai-professional-twin-backend" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          # Layer cache in GitHub Actions: `uv sync` of chromadb and friends is
          # the slow part and rarely changes.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "Pushed \`${{ steps.image.outputs.name }}:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Roll out with:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "az containerapp update -n ai-twin-api -g ai-twin-rg --image ${{ steps.image.outputs.name }}:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
