<!doctype html>
<!-- Re-render: with the backend on port 8000, run `npx vite` in frontend/, open http://localhost:5173/scripts/og-card/og-card.html in Chrome for Testing at a 1200x630 viewport, wait for <html data-state="ready">, capture a PNG over CDP to public/og-image.png, then run stamp_provenance.py on it with the date in data-now. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Share card</title>
    <style>
      :root {
        --paper: #ffffff;
        --ink: #1b1b1b;
        --muted: #5b6470;
        --grid: #c9dcef;
        --edu: #e3f0db;
        --work: #e4edf7;
        --edu-bar: #548238;
        --work-bar: #5c7fa8;
        --route: #c2185b;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--paper);
        color: var(--ink);
        font-family: 'Signika', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .sheet {
        position: absolute;
        inset: 24px;
        border: 2px solid var(--ink);
        box-shadow:
          inset 0 0 0 6px var(--paper),
          inset 0 0 0 7px var(--ink);
        padding: 56px 64px 0;
      }
      h1 {
        font-size: 88px;
        font-weight: 600;
        line-height: 1;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .role {
        margin-top: 18px;
        font-size: 36px;
      }
      dl {
        display: grid;
        grid-template-columns: 150px 1fr;
        gap: 10px 20px;
        margin-top: 34px;
        align-items: baseline;
      }
      dt {
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }
      dd {
        font-size: 28px;
      }
      .route {
        position: absolute;
        left: 9px;
        bottom: 9px;
      }
      .band {
        opacity: 0.8;
      }
      .band.education {
        fill: var(--edu);
      }
      .band.work {
        fill: var(--work);
      }
      .grid {
        stroke: var(--grid);
        stroke-width: 1;
        shape-rendering: crispEdges;
      }
      .bar.education {
        fill: var(--edu-bar);
      }
      .bar.work {
        fill: var(--work-bar);
      }
      .path {
        fill: none;
        stroke-linejoin: round;
      }
      .casing {
        stroke: var(--paper);
        stroke-width: 12;
      }
      .line {
        stroke: var(--route);
        stroke-width: 6;
      }
      .leg {
        stroke: var(--route);
        stroke-width: 4;
        stroke-dasharray: 8 7;
      }
      .here {
        fill: var(--route);
      }
      .ring {
        fill: var(--paper);
        stroke: var(--route);
        stroke-width: 4;
      }
      .ring.reached {
        fill: var(--route);
      }
      .error {
        padding: 24px;
        font: 20px/1.4 ui-monospace, monospace;
        color: var(--route);
        white-space: pre-wrap;
      }
    </style>
    <script type="module" src="./og-card.ts"></script>
  </head>
  <body>
    <main class="sheet">
      <h1 data-slot="name"></h1>
      <p class="role" data-slot="role"></p>
      <dl data-slot="facts"></dl>
      <svg class="route" data-slot="route" aria-hidden="true"></svg>
    </main>
  </body>
</html>
